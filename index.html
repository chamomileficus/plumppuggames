<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plump Pug Games</title>
<style>
  :root {
    --bg: #fbfaf8;
    --fg: #22201d;
    --muted: #6b655d;
    --rule: #e3ded6;
    --link: #8a4b2a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171513;
      --fg: #e8e4dd;
      --muted: #9a938a;
      --rule: #322e29;
      --link: #d99a6c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171513;
    --fg: #e8e4dd;
    --muted: #9a938a;
    --rule: #322e29;
    --link: #d99a6c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 48px 16px 80px;
  }
  main { max-width: 42rem; margin: 0 auto; }
  h1 { font-size: 1.75rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1rem; margin: 2rem 0 .5rem; color: var(--muted); font-weight: 600;
       letter-spacing: .04em; text-transform: uppercase; }
  ul { margin: 0; padding: 0; list-style: none; }
  li { padding: .4rem 0; border-bottom: 1px solid var(--rule); }
  li:last-child { border-bottom: 0; }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
  <h1>Plump Pug Games</h1>

  <h2>Privacy policies</h2>
  <ul>
    <li><a href="aces-to-ashes/privacy/">Aces To Ashes</a></li>
  </ul>
</main>
</body>
</html>
